dataset:
  name: "sentence-transformers/parallel-sentences-wikimatrix"
  subset: "en-vi"
  src_lang: "en"
  tgt_lang: "vi"
  max_seq_length: 384  # tokens of prompt + answer; longer samples are dropped, never truncated
  train_sample_size: 50000
  tm_sample_size: 50000
  eval_sample_size: 1500
  min_words: 3
  max_words: 100
  max_length_ratio: 2.8
  min_semantic_similarity: 0.65

model:
  base_model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  lora_output_dir: "./models/qwen-wikimatrix-sft-lora"
  dpo_output_dir: "./models/qwen-wikimatrix-dpo-lora"

qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 0.0002
  train_batch_size: 16
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  num_train_epochs: 2

dpo:
  beta: 0.1
  learning_rate: 0.00005
  num_train_epochs: 1
  batch_size: 8
